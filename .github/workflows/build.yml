name: Build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: wrappe.exe
            asset-name: wrappe-windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: wrappe
            asset-name: wrappe-linux-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          show-progress: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset-name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  build-gui:
    name: Build GUI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: wrappe-gui.exe
            asset-name: wrappe-gui-windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: wrappe-gui
            asset-name: wrappe-gui-linux-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build GUI (release)
        run: cargo build --release --target ${{ matrix.target }} -p wrappe-gui

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset-name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
